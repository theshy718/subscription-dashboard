<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>存量客户 · 订阅数据看板</title>
<style>
:root{--bg:#0f1419;--panel:#1a2332;--border:#2d3a4f;--text:#e7ecf3;--muted:#8b9bb4;--accent:#3b82f6;--ok:#22c55e;--warn:#fbbf24;--bad:#f87171;--pop:#1e2a3d}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:20px 24px 48px;color:var(--text);background:var(--bg)}
a{color:var(--accent)}
.site-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px;padding:10px 12px;background:rgba(36,48,68,.9);border:1px solid var(--border);border-radius:10px;font-size:.85rem}
.site-nav a{color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:7px}
.site-nav a:hover{color:var(--text);background:rgba(59,130,246,.2)}
.site-nav a.active{color:#fff;background:var(--accent)}
.site-nav .brand{color:var(--text);font-weight:700;margin-right:6px;padding:5px 4px}
h1{font-size:1.35rem;margin:0 0 6px}
.banner{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:0 0 16px;font-size:13px;line-height:1.55;color:var(--muted)}
.banner b{color:var(--text)}
.banner .warn{color:var(--warn)}
.kpi{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.kpi div{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:120px}
.kpi b{display:block;font-size:1.15rem}
.kpi span{color:var(--muted);font-size:11px}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.filters input{background:#0f1419;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:13px;min-width:200px}
.filters button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.filters button.secondary{background:#243044;color:var(--text)}
.filters .hint{font-size:11px;color:var(--muted);align-self:center}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:calc(100vh - 260px);background:var(--panel);position:relative}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{position:sticky;top:0;background:#243044;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;z-index:2}
th:hover{color:var(--text)}
th .th-inner{display:inline-flex;align-items:center;gap:3px;max-width:100%}
th .sort{opacity:.45;font-size:10px}
th.sorted .sort{opacity:1;color:var(--accent)}
th .filt-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:0;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;padding:0;font-size:11px;line-height:1;position:relative;flex-shrink:0}
th .filt-btn:hover{background:rgba(59,130,246,.25);color:var(--text)}
th .filt-btn.active{color:var(--accent)}
th .filt-btn .badge{position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1px solid #243044}
tr:hover td{background:rgba(59,130,246,.08)}
tfoot td{position:sticky;bottom:0;background:#243044;font-weight:700;border-top:2px solid var(--accent);z-index:2}
.cov-full{color:var(--ok)} .cov-partial{color:var(--warn)} .cov-none{color:var(--bad)}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.bl-yes{color:var(--bad);font-weight:600} .bl-no{color:var(--muted)}
.meta{color:var(--muted);font-size:12px;margin:8px 0}
.uid{font-variant-numeric:tabular-nums}
.name{max-width:160px;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-style:italic}

/* WPS-like filter popover */
#colFilterPop{
  display:none;position:fixed;z-index:1000;min-width:240px;max-width:300px;
  background:var(--pop);border:1px solid var(--border);border-radius:8px;
  box-shadow:0 12px 40px rgba(0,0,0,.45);padding:10px;font-size:12px;color:var(--text)
}
#colFilterPop.open{display:block}
#colFilterPop .pop-title{font-weight:600;margin:0 0 8px;color:var(--text);font-size:13px}
#colFilterPop .pop-search{width:100%;background:#0f1419;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 8px;margin:0 0 8px;font-size:12px}
#colFilterPop .pop-range{display:flex;gap:6px;align-items:center;margin:0 0 8px}
#colFilterPop .pop-range input{flex:1;min-width:0;background:#0f1419;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 6px;font-size:12px}
#colFilterPop .pop-actions{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
#colFilterPop .pop-actions button,#colFilterPop .pop-foot button{
  background:#243044;color:var(--text);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:11px;cursor:pointer
}
#colFilterPop .pop-foot{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
#colFilterPop .pop-foot .ok{background:var(--accent);border-color:var(--accent);color:#fff}
#colFilterPop .checklist{max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:5px;background:#0f1419;padding:4px 0}
#colFilterPop .checklist label{display:flex;align-items:center;gap:6px;padding:3px 8px;cursor:pointer;color:var(--text)}
#colFilterPop .checklist label:hover{background:rgba(59,130,246,.15)}
#colFilterPop .checklist input{accent-color:var(--accent)}
#colFilterPop .checklist .empty-opt{color:var(--muted);font-style:italic}
#colFilterPop .pop-hint{color:var(--muted);font-size:11px;margin:0 0 6px}
</style>
</head>
<body>
<nav class="site-nav" aria-label="站点导航">
  <span class="brand">订阅数据看板</span>
  <a href="index.html">续订看板</a>
  <a href="payback.html">回本分析</a>
  <a href="finance.html">财务模型</a>
  <a href="customers.html" class="active">存量客户</a>
</nav>

<h1>存量客户</h1>
<div class="banner" id="banner">加载中…</div>
<div class="kpi" id="kpi"></div>

<div class="filters" id="filters">
  <label>快速搜索 UID / 用户名
    <input type="text" id="q" placeholder="输入用户ID 或 用户名，回车筛选"/>
  </label>
  <button type="button" id="btnApply">搜索</button>
  <button type="button" class="secondary" id="btnClearCol">清除列筛选</button>
  <button type="button" class="secondary" id="btnReset">全部重置</button>
  <button type="button" class="secondary" id="btnExportAll" title="导出全部存量客户为 CSV（UTF-8，Excel 可直接打开）">全量导出</button>
  <button type="button" class="secondary" id="btnExportCardBl" title="导出 MMC 卡号黑名单 CSV（UTF-8，与存量 UID 无关联）">卡号黑名单</button>
  <span class="hint" id="cardBlHint">列头 ▼ 可多选筛选（类 WPS）；点列名排序 · 全量导出不按当前筛选</span>
</div>
<p class="meta" id="filterMeta"></p>

<div class="table-wrap" id="tableWrap">
<table id="tbl">
<thead><tr id="theadRow"></tr></thead>
<tbody id="tbody"></tbody>
<tfoot id="tfoot"></tfoot>
</table>
</div>

<div id="colFilterPop" role="dialog" aria-label="列筛选"></div>

<script>
const MONEY = (v) => {
  if (v == null || Number.isNaN(+v)) return '—';
  const n = +v;
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
};
const NUM = (v) => (v == null || Number.isNaN(+v)) ? '—' : String(+v);
const EMPTY_LABEL = '(空)';

/** Column defs: type cat | num | date | money */
const COLS = [
  {k:'用户ID', label:'用户ID', type:'cat', align:'left'},
  {k:'用户名', label:'用户名', type:'cat', align:'left'},
  {k:'首次购买时间', label:'首次购买时间', type:'date'},
  {k:'首购档', label:'首购档', type:'cat', format:'tier'},
  {k:'首购套餐', label:'首购套餐', type:'cat'},
  {k:'订阅状态', label:'订阅状态', type:'cat'},
  {k:'是否黑名单', label:'是否黑名单', type:'cat'},
  {k:'已续费次数', label:'已续费', type:'num'},
  {k:'续费失败次数', label:'续费失败', type:'num'},
  {k:'总次数', label:'总次数', type:'num'},
  {k:'已支付笔数', label:'已支付笔', type:'num'},
  {k:'总订单次数', label:'总订单', type:'num'},
  {k:'已支付GMV', label:'已支付GMV', type:'money'},
  {k:'已收取手续费', label:'已收手续费', type:'money'},
  {k:'扣费失败手续费', label:'失败手续费', type:'money'},
  {k:'退款金额', label:'退款金额', type:'money'},
  {k:'退款附加费', label:'退款附加费', type:'money'},
  {k:'拒付预警费', label:'拒付预警费', type:'money'},
  {k:'最后净收益', label:'最后净收益', type:'money'},
  {k:'最近支付时间', label:'最近支付', type:'date'},
  {k:'对账覆盖', label:'对账覆盖', type:'cat'},
];

let ALL = [];
let META = {};
let view = [];
let sortKey = '首次购买时间';
let sortDir = -1;
/** @type {Record<string, any>} */
let colFilters = {}; // k -> {kind:'cat', selected:Set} | {kind:'num'|'money', min, max} | {kind:'date', from, to}
let openFilterKey = null;

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shortName(n) {
  if (!n) return '';
  const s = String(n);
  return s.length <= 24 ? s : s.slice(0, 10) + '…' + s.slice(-8);
}
function cellRaw(r, k) {
  const v = r[k];
  if (v == null || v === '') return '';
  return v;
}
/** Normalized categorical token for filter matching */
function catToken(r, k) {
  const v = cellRaw(r, k);
  if (v === '' || v == null) return EMPTY_LABEL;
  return String(v);
}
function numOr(v, d) {
  if (v === '' || v == null) return d;
  const n = +v;
  return Number.isFinite(n) ? n : d;
}
function isFilterActive(k) {
  const f = colFilters[k];
  if (!f) return false;
  if (f.kind === 'cat') return f.selected && f.selected.size > 0;
  if (f.kind === 'num' || f.kind === 'money') return f.min != null || f.max != null;
  if (f.kind === 'date') return !!(f.from || f.to);
  return false;
}
function activeFilterCount() {
  return COLS.reduce((n, c) => n + (isFilterActive(c.k) ? 1 : 0), 0);
}

function buildThead() {
  const tr = document.getElementById('theadRow');
  tr.innerHTML = '';
  for (const c of COLS) {
    const th = document.createElement('th');
    th.dataset.k = c.k;
    th.dataset.type = c.type;
    const inner = document.createElement('span');
    inner.className = 'th-inner';
    const lab = document.createElement('span');
    lab.className = 'th-label';
    lab.textContent = c.label;
    const sort = document.createElement('span');
    sort.className = 'sort';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'filt-btn' + (isFilterActive(c.k) ? ' active' : '');
    btn.title = '筛选 ' + c.label;
    btn.setAttribute('aria-label', '筛选 ' + c.label);
    btn.innerHTML = '▼' + (isFilterActive(c.k) ? '<span class="badge"></span>' : '');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      openColFilter(c, btn);
    });
    inner.appendChild(lab);
    inner.appendChild(sort);
    inner.appendChild(btn);
    th.appendChild(inner);
    th.addEventListener('click', () => {
      if (sortKey === c.k) sortDir *= -1;
      else {
        sortKey = c.k;
        sortDir = (c.type === 'date' || c.k === '首次购买时间' || c.k === '最近支付时间') ? -1 : 1;
      }
      sortAndRender();
    });
    tr.appendChild(th);
  }
}

function distinctCats(k) {
  const set = new Set();
  for (const r of ALL) set.add(catToken(r, k));
  const arr = Array.from(set);
  arr.sort((a, b) => {
    if (a === EMPTY_LABEL) return 1;
    if (b === EMPTY_LABEL) return -1;
    // numeric-ish
    const na = +a, nb = +b;
    if (Number.isFinite(na) && Number.isFinite(nb) && String(na) === a && String(nb) === b) return na - nb;
    return a < b ? -1 : (a > b ? 1 : 0);
  });
  return arr;
}

function openColFilter(col, anchorBtn) {
  const pop = document.getElementById('colFilterPop');
  if (openFilterKey === col.k && pop.classList.contains('open')) {
    closeColFilter();
    return;
  }
  openFilterKey = col.k;
  const existing = colFilters[col.k];

  let body = `<div class="pop-title">筛选 · ${esc(col.label)}</div>`;

  if (col.type === 'cat') {
    const vals = distinctCats(col.k);
    const selected = existing && existing.kind === 'cat' ? new Set(existing.selected) : null;
    body += `<input class="pop-search" id="popSearch" type="text" placeholder="搜索选项…"/>`;
    body += `<div class="pop-actions">
      <button type="button" id="popAll">全选</button>
      <button type="button" id="popNone">全不选</button>
      <button type="button" id="popClear">清除本列</button>
    </div>`;
    body += `<div class="pop-hint">共 ${vals.length} 项 · 勾选后点确定</div>`;
    body += `<div class="checklist" id="popList"></div>`;
    body += `<div class="pop-foot"><button type="button" id="popCancel">取消</button><button type="button" class="ok" id="popOk">确定</button></div>`;
    pop.innerHTML = body;
    const list = document.getElementById('popList');
    const renderList = (q) => {
      const qq = (q || '').trim().toLowerCase();
      list.innerHTML = '';
      const frag = document.createDocumentFragment();
      let n = 0;
      for (const v of vals) {
        if (qq && !v.toLowerCase().includes(qq)) continue;
        n++;
        if (n > 500) { // safety for high-cardinality
          const more = document.createElement('div');
          more.style.cssText = 'padding:6px 8px;color:var(--muted)';
          more.textContent = '…仅显示前 500 项，请缩小搜索';
          frag.appendChild(more);
          break;
        }
        const lab = document.createElement('label');
        if (v === EMPTY_LABEL) lab.className = 'empty-opt';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = v;
        // default: all selected if no filter; else honor selected set
        cb.checked = selected ? selected.has(v) : true;
        lab.appendChild(cb);
        const span = document.createElement('span');
        span.textContent = col.format === 'tier' && v !== EMPTY_LABEL && v !== 'other' ? ('$' + v) : v;
        lab.appendChild(span);
        frag.appendChild(lab);
      }
      if (n === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:8px;color:var(--muted)';
        empty.textContent = '无匹配项';
        frag.appendChild(empty);
      }
      list.appendChild(frag);
    };
    renderList('');
    document.getElementById('popSearch').addEventListener('input', (e) => renderList(e.target.value));
    document.getElementById('popAll').onclick = () => {
      list.querySelectorAll('input[type=checkbox]').forEach(c => { c.checked = true; });
    };
    document.getElementById('popNone').onclick = () => {
      list.querySelectorAll('input[type=checkbox]').forEach(c => { c.checked = false; });
    };
    document.getElementById('popClear').onclick = () => {
      delete colFilters[col.k];
      closeColFilter();
      applyFilters();
    };
    document.getElementById('popCancel').onclick = () => closeColFilter();
    document.getElementById('popOk').onclick = () => {
      // collect checked among ALL vals currently rendered + previously selected not in view?
      // Simpler: if search active, merge with previous selected for hidden items
      const qq = (document.getElementById('popSearch').value || '').trim().toLowerCase();
      const next = selected ? new Set(selected) : new Set(vals);
      // update visible
      list.querySelectorAll('input[type=checkbox]').forEach(c => {
        if (c.checked) next.add(c.value);
        else next.delete(c.value);
      });
      // if no search and all checked → clear filter (show all)
      if (!qq && next.size === vals.length) {
        delete colFilters[col.k];
      } else if (next.size === 0) {
        // none selected → keep empty set (shows 0 rows)
        colFilters[col.k] = {kind:'cat', selected: next};
      } else {
        colFilters[col.k] = {kind:'cat', selected: next};
      }
      closeColFilter();
      applyFilters();
    };
  } else if (col.type === 'num' || col.type === 'money') {
    const minV = existing && (existing.kind === 'num' || existing.kind === 'money') ? (existing.min ?? '') : '';
    const maxV = existing && (existing.kind === 'num' || existing.kind === 'money') ? (existing.max ?? '') : '';
    body += `<div class="pop-hint">数值范围（留空=不限）</div>`;
    body += `<div class="pop-range">
      <input type="number" id="popMin" step="any" placeholder="最小值" value="${esc(minV)}"/>
      <span>~</span>
      <input type="number" id="popMax" step="any" placeholder="最大值" value="${esc(maxV)}"/>
    </div>`;
    body += `<div class="pop-foot">
      <button type="button" id="popClear">清除本列</button>
      <button type="button" id="popCancel">取消</button>
      <button type="button" class="ok" id="popOk">确定</button>
    </div>`;
    pop.innerHTML = body;
    document.getElementById('popClear').onclick = () => {
      delete colFilters[col.k];
      closeColFilter();
      applyFilters();
    };
    document.getElementById('popCancel').onclick = () => closeColFilter();
    document.getElementById('popOk').onclick = () => {
      const minRaw = document.getElementById('popMin').value.trim();
      const maxRaw = document.getElementById('popMax').value.trim();
      if (minRaw === '' && maxRaw === '') delete colFilters[col.k];
      else {
        colFilters[col.k] = {
          kind: col.type,
          min: minRaw === '' ? null : +minRaw,
          max: maxRaw === '' ? null : +maxRaw,
        };
      }
      closeColFilter();
      applyFilters();
    };
  } else if (col.type === 'date') {
    const fromV = existing && existing.kind === 'date' ? (existing.from || '') : '';
    const toV = existing && existing.kind === 'date' ? (existing.to || '') : '';
    body += `<div class="pop-hint">日期范围（按日，留空=不限）</div>`;
    body += `<div class="pop-range">
      <input type="date" id="popFrom" value="${esc(fromV)}"/>
      <span>~</span>
      <input type="date" id="popTo" value="${esc(toV)}"/>
    </div>`;
    body += `<div class="pop-foot">
      <button type="button" id="popClear">清除本列</button>
      <button type="button" id="popCancel">取消</button>
      <button type="button" class="ok" id="popOk">确定</button>
    </div>`;
    pop.innerHTML = body;
    document.getElementById('popClear').onclick = () => {
      delete colFilters[col.k];
      closeColFilter();
      applyFilters();
    };
    document.getElementById('popCancel').onclick = () => closeColFilter();
    document.getElementById('popOk').onclick = () => {
      const from = document.getElementById('popFrom').value || '';
      const to = document.getElementById('popTo').value || '';
      if (!from && !to) delete colFilters[col.k];
      else colFilters[col.k] = {kind:'date', from, to};
      closeColFilter();
      applyFilters();
    };
  }

  pop.classList.add('open');
  // position near button
  const rect = anchorBtn.getBoundingClientRect();
  const pw = 280;
  let left = rect.left;
  let top = rect.bottom + 4;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (left < 8) left = 8;
  if (top + 360 > window.innerHeight) top = Math.max(8, rect.top - 360);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}

function closeColFilter() {
  const pop = document.getElementById('colFilterPop');
  pop.classList.remove('open');
  pop.innerHTML = '';
  openFilterKey = null;
}

document.addEventListener('mousedown', (e) => {
  const pop = document.getElementById('colFilterPop');
  if (!pop.classList.contains('open')) return;
  if (pop.contains(e.target)) return;
  if (e.target.closest && e.target.closest('.filt-btn')) return;
  closeColFilter();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeColFilter();
});

function rowPassColFilters(r) {
  for (const c of COLS) {
    const f = colFilters[c.k];
    if (!f) continue;
    if (f.kind === 'cat') {
      const tok = catToken(r, c.k);
      if (!f.selected.has(tok)) return false;
    } else if (f.kind === 'num' || f.kind === 'money') {
      const n = +cellRaw(r, c.k);
      const val = Number.isFinite(n) ? n : 0;
      if (f.min != null && Number.isFinite(f.min) && val < f.min) return false;
      if (f.max != null && Number.isFinite(f.max) && val > f.max) return false;
    } else if (f.kind === 'date') {
      const d = String(cellRaw(r, c.k) || '').slice(0, 10);
      if (f.from && (!d || d < f.from)) return false;
      if (f.to && (!d || d > f.to)) return false;
    }
  }
  return true;
}

function applyFilters() {
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  view = ALL.filter(r => {
    if (q) {
      const id = String(r['用户ID'] || '').toLowerCase();
      const name = String(r['用户名'] || '').toLowerCase();
      if (!id.includes(q) && !name.includes(q)) return false;
    }
    return rowPassColFilters(r);
  });
  sortAndRender();
}

function cmp(a, b, k) {
  let va = a[k], vb = b[k];
  const col = COLS.find(c => c.k === k);
  const numeric = col && (col.type === 'num' || col.type === 'money');
  if (numeric) {
    va = +va || 0; vb = +vb || 0;
    return va === vb ? 0 : (va < vb ? -1 : 1);
  }
  va = va == null ? '' : String(va);
  vb = vb == null ? '' : String(vb);
  return va < vb ? -1 : (va > vb ? 1 : 0);
}

function sortAndRender() {
  view.sort((a, b) => sortDir * cmp(a, b, sortKey));
  render();
}

function fmtCell(r, c) {
  const v = r[c.k];
  if (c.type === 'money') {
    if (c.k === '最后净收益') {
      const net = +v || 0;
      return `<td class="${net<0?'neg':'pos'}">${MONEY(v)}</td>`;
    }
    return `<td>${MONEY(v)}</td>`;
  }
  if (c.type === 'num') return `<td>${NUM(v)}</td>`;
  if (c.k === '用户ID') return `<td class="uid">${esc(v)}</td>`;
  if (c.k === '用户名') return `<td class="name" title="${esc(v||'')}">${esc(shortName(v))}</td>`;
  if (c.k === '首购档') return `<td>${v ? (v === 'other' ? 'other' : '$'+esc(v)) : '—'}</td>`;
  if (c.k === '对账覆盖') {
    const cov = v || 'none';
    return `<td class="cov-${esc(cov)}">${esc(cov)}</td>`;
  }
  if (c.k === '是否黑名单') {
    if (!v) return `<td class="empty">${EMPTY_LABEL}</td>`;
    return `<td class="${v==='是'?'bl-yes':'bl-no'}">${esc(v)}</td>`;
  }
  if (c.k === '订阅状态') {
    if (!v) return `<td class="empty">${EMPTY_LABEL}</td>`;
    return `<td>${esc(v)}</td>`;
  }
  if (!v) return `<td class="empty">—</td>`;
  return `<td>${esc(v)}</td>`;
}

function render() {
  // update sort + filter badges on headers
  document.querySelectorAll('th[data-k]').forEach(th => {
    const k = th.dataset.k;
    th.classList.toggle('sorted', k === sortKey);
    const sp = th.querySelector('.sort');
    if (sp) sp.textContent = k === sortKey ? (sortDir > 0 ? '▲' : '▼') : '';
    const btn = th.querySelector('.filt-btn');
    if (btn) {
      const on = isFilterActive(k);
      btn.classList.toggle('active', on);
      btn.innerHTML = '▼' + (on ? '<span class="badge"></span>' : '');
    }
  });

  const tb = document.getElementById('tbody');
  const frag = document.createDocumentFragment();
  for (const r of view) {
    const tr = document.createElement('tr');
    let html = '';
    for (const c of COLS) html += fmtCell(r, c);
    tr.innerHTML = html;
    frag.appendChild(tr);
  }
  tb.innerHTML = '';
  tb.appendChild(frag);

  const sum = (k) => view.reduce((s, r) => s + (+r[k] || 0), 0);
  // footer: colspan for leading non-sum cols until 已续费
  const lead = COLS.findIndex(c => c.k === '已续费次数');
  const afterNet = COLS.length - COLS.findIndex(c => c.k === '最后净收益') - 1;
  const tf = document.getElementById('tfoot');
  tf.innerHTML = `<tr>
    <td colspan="${lead}">筛选合计 · ${view.length} 人</td>
    <td>${sum('已续费次数')}</td>
    <td>${sum('续费失败次数')}</td>
    <td>${sum('总次数')}</td>
    <td>${sum('已支付笔数')}</td>
    <td>${sum('总订单次数')}</td>
    <td>${MONEY(sum('已支付GMV'))}</td>
    <td>${MONEY(sum('已收取手续费'))}</td>
    <td>${MONEY(sum('扣费失败手续费'))}</td>
    <td>${MONEY(sum('退款金额'))}</td>
    <td>${MONEY(sum('退款附加费'))}</td>
    <td>${MONEY(sum('拒付预警费'))}</td>
    <td>${MONEY(sum('最后净收益'))}</td>
    <td colspan="${afterNet}"></td>
  </tr>`;

  const nCol = activeFilterCount();
  document.getElementById('filterMeta').textContent =
    `显示 ${view.length} / ${ALL.length} 人 · 排序 ${sortKey} ${sortDir>0?'升序':'降序'}` +
    (nCol ? ` · 列筛选 ${nCol} 个` : '');
}

function renderBanner() {
  const m = META || {};
  const cov = m.fee_coverage_users || {};
  const winLabel = (m.as_of_start && m.as_of_end)
    ? `${esc(String(m.as_of_start).slice(0,10))}～${esc(String(m.as_of_end).slice(0,10))}`
    : '—';
  document.getElementById('banner').innerHTML = `
    <b>数据对齐窗</b> <b>${winLabel}</b>（${esc(m.timezone||'Asia/Shanghai')}）·
    平台有效时间与 PayerMax bill_day 取交集，窗外交易不进存量/笔数/费用。<br/>
    <b>存量</b>=对齐窗内至少一笔已支付 · 次数口径 <b>PayerMax 为主、平台补缺口</b> ·
    费用来自 PayerMax 对账 join（成功费：trade_order_id↔第三方单号；失败费：pm_user_id=用户ID）·
    <b>不改 CAC($160)</b> / 不改 cohort 续订公式 / 不改净收益公式项。<br/>
    <span class="warn">⚠ 订阅状态/黑名单为 MMC 查询快照，可晚于对齐窗截止。</span><br/>
    净收益公式：<b>${esc(m.net_formula || '已支付GMV − 已收取手续费 − 扣费失败手续费 − 退款金额 − 退款附加费 − 拒付预警费')}</b>
    · 退款附加费单独列，并从净收益中扣减。
    · <b>订阅状态 / 是否黑名单</b> 来自 PayerMax MMC（列头 ▼ 可筛选；若全空请强刷清缓存）。
    生成 ${esc((m.generated_at||'').replace('T',' ').slice(0,19))} Asia/Shanghai
    · 客户 <b>${m.n_customers||'—'}</b>
    · 成功单手续费匹配 ${(m.fee_match_rate? (m.fee_match_rate*100).toFixed(2):'—')}%
    （覆盖用户 full ${cov.full||0} / partial ${cov.partial||0} / none ${cov.none||0}）
  `;
  document.getElementById('kpi').innerHTML = `
    <div><span>存量客户</span><b>${(m.n_customers||0).toLocaleString()}</b></div>
    <div><span>已支付 GMV</span><b>${MONEY(m.sum_gmv)}</b></div>
    <div><span>已收手续费</span><b>${MONEY(m.sum_success_fee)}</b></div>
    <div><span>失败手续费</span><b>${MONEY(m.sum_fail_fee)}</b></div>
    <div><span>退款金额</span><b>${MONEY(m.sum_refund)}</b></div>
    <div><span>拒付预警费</span><b>${MONEY(m.sum_cb)}</b></div>
    <div><span>合计净收益</span><b>${MONEY(m.sum_net)}</b></div>
  `;
}

function csvEscape(v) {
  const s = v == null ? '' : String(v);
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

/** Full-dataset CSV (ALL), UTF-8 BOM for Excel. Ignores search/column filters. */
function exportFullCsv() {
  if (!ALL.length) {
    alert('暂无数据可导出');
    return;
  }
  const headers = COLS.map(c => c.label);
  const lines = [headers.map(csvEscape).join(',')];
  for (const r of ALL) {
    lines.push(COLS.map(c => {
      const v = r[c.k];
      return csvEscape(v == null ? '' : v);
    }).join(','));
  }
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'stock_customers_' + y + m + day + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

document.getElementById('btnApply').onclick = applyFilters;
document.getElementById('btnClearCol').onclick = () => {
  colFilters = {};
  closeColFilter();
  applyFilters();
};
document.getElementById('btnReset').onclick = () => {
  document.getElementById('q').value = '';
  colFilters = {};
  closeColFilter();
  applyFilters();
};
document.getElementById('btnExportAll').onclick = exportFullCsv;

/** MMC card-number blacklist (separate from UID stock). Fetches card_blacklist.json → UTF-8 BOM CSV. */
function exportCardBlacklistCsv() {
  const url = 'card_blacklist.json?v=' + encodeURIComponent((window.__SC_V || Date.now()));
  fetch(url, {cache:'no-store'})
    .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data => {
      const rows = (data && data.rows) || [];
      if (!rows.length) {
        alert('卡号黑名单暂无数据');
        return;
      }
      const headers = ['卡号', '状态', '创建时间', '操作人', '备注'];
      const lines = [headers.map(csvEscape).join(',')];
      for (const r of rows) {
        lines.push(headers.map(h => csvEscape(r[h] == null ? '' : r[h])).join(','));
      }
      const blob = new Blob(['\uFEFF' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'});
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'card_blacklist_' + y + m + day + '.csv';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    })
    .catch(err => alert('加载卡号黑名单失败：' + err.message));
}
document.getElementById('btnExportCardBl').onclick = exportCardBlacklistCsv;

// Optional count hint from card_blacklist.json (non-blocking)
fetch('card_blacklist.json?v=' + encodeURIComponent((window.__SC_V || Date.now())), {cache:'no-store'})
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (!data || data.n == null) return;
    const el = document.getElementById('cardBlHint');
    if (!el) return;
    const asOf = (data.as_of || '').replace('T', ' ').slice(0, 16);
    el.textContent =
      '列头 ▼ 可多选筛选（类 WPS）；点列名排序 · 全量导出不按当前筛选 · 卡号黑名单 ' +
      data.n + ' 条' + (asOf ? ' · 已同步 ' + asOf : '');
  })
  .catch(() => {});

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') applyFilters();
});

buildThead();

fetch('stock_customers.json?v=' + encodeURIComponent((window.__SC_V || Date.now())), {cache:'no-store'})
  .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(data => {
    META = data.meta || {};
    ALL = data.rows || [];
    // ensure new keys exist client-side even on older JSON
    for (const r of ALL) {
      if (r['订阅状态'] == null) r['订阅状态'] = '';
      if (r['是否黑名单'] == null) r['是否黑名单'] = '';
    }
    renderBanner();
    applyFilters();
  })
  .catch(err => {
    document.getElementById('banner').innerHTML =
      '<span class="warn">加载 stock_customers.json 失败：'+esc(err.message)+
      '。请确认与本页同目录，或重新运行 build_stock_customers.py。</span>';
  });
</script>
